toolbelt:
  - label: "Build"
    tools: "JavaScript · HTML/CSS · Python · C++"
  - label: "Connect"
    tools: "APIs · Webhooks · CMS/CRM · Particle Cloud"
  - label: "Data & vision"
    tools: "OpenCV · NumPy · InfluxDB · Grafana"
  - label: "Ship"
    tools: "Git · Jekyll · GitHub Pages · QA"

groups:
  - id: "web-integration"
    title: "Web & integration"
    description: "Interfaces and integrations built around the workflow they need to support."
    used_in: "Client systems, workflow automation, and this portfolio"
    items:
      - name: "JavaScript, HTML & CSS"
        context: "Interactive websites and browser-based experiences."
      - name: "APIs & webhooks"
        context: "Business-system and workflow integrations."
      - name: "CMS/CRM workflows"
        context: "Websites, intake paths, content operations, and customer records."
      - name: "Jekyll & GitHub Pages"
        context: "The static-site and deployment foundation used for this portfolio."
      - name: "Git"
        context: "Source control, isolated branches, and preview workflows."

  - id: "python-data-vision"
    title: "Python, data & vision"
    description: "Data handling and computer-vision studies with attention to inputs and failure cases."
    used_in: "Computer-vision studies, automation, and ML-product contribution"
    items:
      - name: "Python"
        context: "Automation, data handling, and computer-vision experiments."
      - name: "OpenCV, NumPy & Pillow"
        context: "Webcam input, image cleanup, preprocessing, and conversion."
      - name: "DeepFace / FaceNet & scikit-learn"
        context: "Embedding and cosine-similarity ranking in a face-similarity study."
      - name: "Tesseract OCR"
        context: "Text extraction from scanned-card images after OpenCV preprocessing."
      - name: "Data validation & model testing"
        context: "Input quality, edge cases, failure modes, and output review."
      - name: "InfluxDB & Grafana"
        context: "Telemetry storage and visualization in the Arcadia capstone."

  - id: "embedded-physical"
    title: "Embedded & physical systems"
    description: "Code and tooling that cross the boundary between software and physical systems."
    used_in: "Vehicle telemetry capstone and Hasbro internship"
    items:
      - name: "C++"
        context: "OBD-II requests, ECU-response processing, and Particle firmware."
      - name: "OBD-II, CAN bus & Carloop"
        context: "Vehicle-data capture in the Arcadia capstone."
      - name: "Particle Cloud"
        context: "Moving recorded telemetry from the vehicle setup into the data pipeline."
      - name: "Blender & 3D modeling"
        context: "Modular modeling and production-support work during the Hasbro internship."

  - id: "implementation-delivery"
    title: "Implementation & delivery"
    description: "The work between a technical idea and a usable release."
    used_in: "Professional AI implementation, client delivery, and technical support"
    items:
      - name: "Requirements & workflow mapping"
        context: "Turn operational needs and open questions into scoped work."
      - name: "Technical project coordination"
        context: "Keep dependencies, owners, status, and next actions visible."
      - name: "QA & release readiness"
        context: "End-to-end checks, issue tracking, launch material, and support planning."
      - name: "Onboarding & documentation"
        context: "Access plans, handoffs, rollout guides, and feedback loops."
      - name: "Stakeholder communication"
        context: "Clear project updates and decision-focused handoffs."
      - name: "Zendesk & technical support"
        context: "Ticket triage, troubleshooting, documentation, and follow-through at Arcadia."
